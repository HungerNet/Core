name: Build and deploy API

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-api
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: uv sync --project backend --all-groups
      - name: Lint backend
        run: uv run --project backend ruff check backend
      - name: Test backend
        run: uv run --project backend pytest
      - id: meta
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/api"
          tag="${GITHUB_SHA}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production-api
    steps:
      - uses: actions/checkout@v4
      - name: Deploy immutable image to configured VPS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          VPS_ENV_FILE: ${{ secrets.VPS_ENV_FILE }}
          API_IMAGE: ${{ needs.build.outputs.image }}:${{ needs.build.outputs.tag }}
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          GHCR_DEPLOY_USER: ${{ secrets.GHCR_DEPLOY_USER }}
          GHCR_DEPLOY_TOKEN: ${{ secrets.GHCR_DEPLOY_TOKEN }}
        shell: bash
        run: |
          umask 077
          : "${DEPLOY_HOST:?Set DEPLOY_HOST}"
          : "${DEPLOY_USER:?Set DEPLOY_USER}"
          : "${DEPLOY_PATH:?Set DEPLOY_PATH}"
          : "${VPS_ENV_FILE:?Set VPS_ENV_FILE}"
          : "${SSH_PRIVATE_KEY:?Set DEPLOY_SSH_PRIVATE_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?Set DEPLOY_KNOWN_HOSTS}"
          : "${GHCR_DEPLOY_USER:?Set GHCR_DEPLOY_USER}"
          : "${GHCR_DEPLOY_TOKEN:?Set GHCR_DEPLOY_TOKEN}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          cleanup() {
            ssh "$remote" "docker logout ghcr.io" >/dev/null 2>&1 || true
            rm -f ~/.ssh/id_ed25519
          }
          trap cleanup EXIT
          printf '%s' "$GHCR_DEPLOY_TOKEN" | ssh "$remote" "docker login ghcr.io --username '$GHCR_DEPLOY_USER' --password-stdin"
          sh infra/scripts/deploy-vps.sh
