x-api-environment: &api-environment
  ENVIRONMENT: ${ENVIRONMENT:-production}
  API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the VPS environment file}
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the VPS environment file}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  JWT_EXPIRY_MINUTES: ${JWT_EXPIRY_MINUTES:-60}
  TRUST_HOST: ${TRUST_HOST:-https://auth.hungernet.dev}
  OAUTH_CALLBACK_BASE_URL: ${OAUTH_CALLBACK_BASE_URL:-https://auth.hungernet.dev/api/v1}
  ALLOWED_OAUTH_PROVIDERS: '["google", "github", "discord"]'
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
  DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
  DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-["https://accounts.hungernet.dev","https://admin.hungernet.dev","https://hungernet.dev","https://hungersmp.com","https://ifamished.com","https://optifineforfabric.com","https://accounts.millered001.workers.dev","https://*.millered001.workers.dev"]}
  ALLOWED_RETURN_ORIGINS: ${ALLOWED_RETURN_ORIGINS:-["https://accounts.hungernet.dev","https://admin.hungernet.dev","https://hungernet.dev","https://hungersmp.com","https://ifamished.com","https://optifineforfabric.com","https://accounts.millered001.workers.dev","https://*.millered001.workers.dev"]}
  SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-hungernet_session}
  CSRF_COOKIE_NAME: ${CSRF_COOKIE_NAME:-hungernet_csrf}
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
  SESSION_COOKIE_SAME_SITE: ${SESSION_COOKIE_SAME_SITE:-lax}
  SESSION_COOKIE_DOMAIN: ${SESSION_COOKIE_DOMAIN:-.hungernet.dev}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
  RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-60}
  RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hungernet}
      POSTGRES_USER: ${POSTGRES_USER:-hungernet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the VPS environment file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  api:
    image: ${API_IMAGE:-hungernet-api:local}
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment: *api-environment
    ports:
      - "8000:8000"
    expose:
      - "8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks:
      - backend

  migrate:
    image: ${API_IMAGE:-hungernet-api:local}
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment: *api-environment
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "8090:80"
      - "8443:443"
      - "8443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks:
      - backend

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  backend:
    driver: bridge